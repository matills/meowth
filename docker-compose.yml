services:
  db-init:
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    command: ["solana-trading", "init-db"]
    restart: "no"

  # Placeholder for Fase 1/3 single-writer trading engine (Scout -> Analyst -> Strategist -> Risk -> Executor)
  engine:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    command: ["solana-trading", "check-config"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "solana-trading", "check-config"]
      interval: 60s
      timeout: 10s
      retries: 3
