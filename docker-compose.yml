services:
  db-init:
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    command: ["solana-trading", "init-db"]
    restart: "no"

  engine:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    command: ["solana-trading", "run-paper", "--interval", "60"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "solana-trading", "check-config"]
      interval: 60s
      timeout: 10s
      retries: 3

  dashboard:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    ports:
      - "8080:8080"
    command: ["solana-trading", "dashboard", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
