[project]
name = "meowth"
version = "0.1.0"
description = "24/7 Solana paper-first trading agent system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "solana>=0.35.0,<1.0.0",
    "solders>=0.21.0,<1.0.0",
    "structlog>=24.4.0,<26.0.0",
]

[project.optional-dependencies]
backtest = [
    "pandas>=2.2.0,<3.0.0",
    "quantstats>=0.0.62,<1.0.0",
]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.7.0,<1.0.0",
]

[project.scripts]
meowth = "meowth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meowth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
